<style>
html, body, #root { margin: 0; min-height: 100%; }
body { background: #0b0d12; }
.es-page { background: #0b0d12; color: #f3efe8; min-height: 100vh; font-family: Georgia, 'Times New Roman', serif; }
.es-hero { position: relative; height: clamp(380px, 85vw, 640px); overflow: hidden; }
.es-hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 85%; }
.es-hero-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,13,18,.25) 0%, rgba(11,13,18,.1) 40%, #0b0d12 100%); }
.es-hero-text { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 24px 36px; max-width: 1100px; margin: 0 auto; box-sizing: border-box; }
.es-kicker { margin: 0 0 8px; font: 500 12px/1.4 system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #f0c98a; }
.es-title { margin: 0; font-weight: 400; font-style: italic; font-size: clamp(48px, 13vw, 128px); line-height: .95; letter-spacing: -.02em; }
.es-frames { max-width: 1100px; margin: 0 auto; padding: 24px 16px 8px; display: grid; gap: 40px; box-sizing: border-box; }
.es-frame { margin: 0; }
.es-frame img { display: block; width: 100%; height: auto; border-radius: 4px; }
.es-frame figcaption { display: flex; gap: 14px; align-items: baseline; padding: 12px 4px 0; }
.es-num { font: 500 13px system-ui, sans-serif; color: #f0c98a; letter-spacing: .1em; }
.es-cap { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.es-cap strong { font-weight: 400; font-size: 22px; }
.es-cap em { font: 12px system-ui, sans-serif; letter-spacing: .15em; text-transform: uppercase; color: #9aa0ab; }
.es-foot { text-align: center; padding: 48px 16px 56px; font: 12px system-ui, sans-serif; letter-spacing: .15em; text-transform: uppercase; color: #6d7480; }
@media (min-width: 900px) {
  .es-frames { grid-template-columns: 1fr 1fr; gap: 56px 32px; padding: 40px 24px; }
  .es-frame:nth-child(even) { margin-top: 64px; }
  .es-hero-text { padding-bottom: 56px; }
}

</style></head>
